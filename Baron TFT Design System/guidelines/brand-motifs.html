<!-- @dsCard group="Brand" viewport="700x160" name="Motifs — hex & spot ink" subtitle="Hexagons, cobalt ink, offset shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:22px;font-family:var(--font-body)}.row{display:flex;gap:18px;align-items:center}.item{display:flex;flex-direction:column;align-items:center;gap:8px}.item span{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}.hex{width:64px;height:73px;clip-path:var(--hex-clip)}</style></head>
<body><div class="row">
<div class="item"><div class="hex" style="background:var(--grad-gold);box-shadow:var(--glow-soft-gold)"></div><span>cobalt hex</span></div>
<div class="item"><div class="hex" style="background:var(--ink-800);border:1px solid var(--border-strong)"></div><span>empty hex</span></div>
<div class="item"><div class="hex" style="background:var(--cost-4)"></div><span>cost hex</span></div>
<div class="item"><div style="width:120px;height:64px;border-radius:8px;background:var(--grad-board);border:1px solid var(--border-line)"></div><span>paper board</span></div>
<div class="item"><div style="width:120px;height:64px;border-radius:8px;background:var(--grad-gold)"></div><span>cobalt ink</span></div>
</div></body></html>
