<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:22px;font-family:var(--font-mono)}.row{display:flex;gap:26px;align-items:baseline}.stat b{font-size:30px;font-weight:700;font-feature-settings:'tnum' 1}.stat span{font-family:var(--font-body);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle);display:block;margin-top:2px}</style></head>
<body><div class="row">
<div class="stat"><b style="color:var(--gold-300)">50 ⛁</b><span>Vàng</span></div>
<div class="stat"><b style="color:var(--danger)">72 HP</b><span>Máu</span></div>
<div class="stat"><b style="color:var(--teal-300)">Lv.7</b><span>Cấp</span></div>
<div class="stat"><b style="color:var(--text-body)">35%</b><span>Tỉ lệ 4★</span></div>
<div class="stat"><b style="color:var(--text-body)">2-3</b><span>Vòng</span></div>
</div></body></html>
