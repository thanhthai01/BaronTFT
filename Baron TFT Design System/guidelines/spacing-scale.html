<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base with off-grid stops" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:22px;font-family:var(--font-mono)}.row{display:flex;align-items:flex-end;gap:14px}.b{display:flex;flex-direction:column;align-items:center;gap:6px}.bar{background:var(--grad-gold);border-radius:2px;width:22px}.b span{font-size:10px;color:var(--text-subtle)}</style></head>
<body><div class="row">
<div class="b"><div class="bar" style="height:4px"></div><span>4</span></div>
<div class="b"><div class="bar" style="height:8px"></div><span>8</span></div>
<div class="b"><div class="bar" style="height:12px"></div><span>12</span></div>
<div class="b"><div class="bar" style="height:16px"></div><span>16</span></div>
<div class="b"><div class="bar" style="height:24px"></div><span>24</span></div>
<div class="b"><div class="bar" style="height:32px"></div><span>32</span></div>
<div class="b"><div class="bar" style="height:48px"></div><span>48</span></div>
<div class="b"><div class="bar" style="height:64px"></div><span>64</span></div>
<div class="b"><div class="bar" style="height:80px"></div><span>80</span></div>
</div></body></html>
