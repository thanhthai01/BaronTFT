<!-- @dsCard group="Colors" viewport="700x160" name="Cobalt — primary" subtitle="Lead spot ink + on-cobalt text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);padding:20px}.row{display:flex;gap:10px}.sw{flex:1;height:96px;border-radius:var(--r-md);border:1px solid var(--border-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.sw b{font-family:var(--font-mono);font-size:12px;font-weight:700}.sw span{font-family:var(--font-mono);font-size:10px}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--gold-50)"><b style="color:#1B1B1B">50</b><span style="color:#1B1B1B">#E9ECFB</span></div>
<div class="sw" style="background:var(--gold-100)"><b style="color:#fff">100</b><span style="color:#fff">#2A44C8</span></div>
<div class="sw" style="background:var(--gold-300)"><b style="color:#fff">300</b><span style="color:#fff">#2A44C8</span></div>
<div class="sw" style="background:var(--gold-500);box-shadow:var(--glow-soft-gold)"><b style="color:#fff">500 ★</b><span style="color:#fff">#2A44C8</span></div>
<div class="sw" style="background:var(--gold-600)"><b style="color:#fff">600</b><span style="color:#fff">#2038B0</span></div>
<div class="sw" style="background:var(--gold-700)"><b style="color:#fff">700</b><span style="color:#fff">#182B8C</span></div>
</div></body></html>
