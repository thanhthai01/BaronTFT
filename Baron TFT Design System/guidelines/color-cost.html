<!-- @dsCard group="Colors" viewport="700x150" name="Champion cost tiers" subtitle="Canonical 1–5 cost palette" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);padding:22px}.row{display:flex;gap:12px}.sw{flex:1;height:100px;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-family:var(--font-display);text-transform:uppercase;font-weight:800}.sw .c{font-size:30px;line-height:1}.sw .h{font-family:var(--font-mono);font-size:10px;font-weight:700}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--cost-1)"><span class="c">1</span><span class="h">#6B7280</span></div>
<div class="sw" style="background:var(--cost-2)"><span class="c">2</span><span class="h">#1E9E57</span></div>
<div class="sw" style="background:var(--cost-3)"><span class="c">3</span><span class="h">#2563EB</span></div>
<div class="sw" style="background:var(--cost-4)"><span class="c">4</span><span class="h">#8B3FD6</span></div>
<div class="sw" style="background:var(--cost-5)"><span class="c">5</span><span class="h">#C0851C</span></div>
</div></body></html>
