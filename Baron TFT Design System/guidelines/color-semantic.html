<!-- @dsCard group="Colors" viewport="700x130" name="Semantic / status" subtitle="success · warning · danger · info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);padding:22px}.row{display:flex;gap:12px}.sw{flex:1;height:76px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;color:#fff;font-weight:700}.sw span{font-family:var(--font-body);text-transform:uppercase;letter-spacing:.06em;font-size:12px}.sw b{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--success)"><span>Success</span><b>#1E9E57</b></div>
<div class="sw" style="background:var(--warning)"><span>Warning</span><b>#C77A16</b></div>
<div class="sw" style="background:var(--danger)"><span>Danger</span><b>#D23A22</b></div>
<div class="sw" style="background:var(--info)"><span>Info</span><b>#2A44C8</b></div>
</div></body></html>
