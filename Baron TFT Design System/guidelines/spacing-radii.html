<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & elevation" subtitle="Crisp corners + hard offset shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:22px;font-family:var(--font-mono)}.row{display:flex;gap:16px;align-items:center}.b{display:flex;flex-direction:column;align-items:center;gap:8px}.box{width:70px;height:56px;background:var(--surface-raised);border:1px solid var(--border-line)}.b span{font-size:10px;color:var(--text-subtle)}</style></head>
<body><div class="row">
<div class="b"><div class="box" style="border-radius:3px"></div><span>xs 3</span></div>
<div class="b"><div class="box" style="border-radius:5px"></div><span>sm 5</span></div>
<div class="b"><div class="box" style="border-radius:8px"></div><span>md 8</span></div>
<div class="b"><div class="box" style="border-radius:12px"></div><span>lg 12</span></div>
<div class="b"><div class="box" style="border-radius:18px"></div><span>xl 18</span></div>
<div class="b" style="margin-left:20px"><div class="box" style="border-radius:8px;box-shadow:var(--shadow-md);border:none"></div><span>shadow-md</span></div>
<div class="b"><div class="box" style="border-radius:8px;box-shadow:var(--glow-gold);border:none"></div><span>glow-gold</span></div>
</div></body></html>
