<!-- @dsCard group="Colors" viewport="700x170" name="Paper neutrals" subtitle="Ivory surfaces + ink text ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);padding:20px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.sw{height:60px;border-radius:var(--r-sm);border:1px solid var(--border-line);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.sw b{font-family:var(--font-mono);font-size:10px;font-weight:700}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);margin:14px 0 6px}</style></head>
<body>
<div class="lbl">SURFACES — paper ramp</div>
<div class="grid">
<div class="sw" style="background:var(--ink-950)"><b style="color:#1B1B1B">950</b></div>
<div class="sw" style="background:var(--ink-900)"><b style="color:#1B1B1B">900</b></div>
<div class="sw" style="background:var(--ink-850)"><b style="color:#1B1B1B">850</b></div>
<div class="sw" style="background:var(--ink-800)"><b style="color:#1B1B1B">800</b></div>
<div class="sw" style="background:var(--ink-700)"><b style="color:#1B1B1B">700</b></div>
<div class="sw" style="background:var(--ink-600)"><b style="color:#1B1B1B">600</b></div>
</div>
<div class="lbl">TEXT — ink ramp · spot inks</div>
<div class="grid">
<div class="sw" style="background:var(--paper-0)"><b style="color:#F1ECDF">paper-0</b></div>
<div class="sw" style="background:var(--paper-1)"><b style="color:#F1ECDF">paper-1</b></div>
<div class="sw" style="background:var(--paper-2)"><b style="color:#F1ECDF">paper-2</b></div>
<div class="sw" style="background:var(--paper-3)"><b style="color:#F1ECDF">paper-3</b></div>
<div class="sw" style="background:var(--gold-500)"><b style="color:#fff">cobalt</b></div>
<div class="sw" style="background:var(--teal-500)"><b style="color:#fff">orange</b></div>
</div>
</body></html>
