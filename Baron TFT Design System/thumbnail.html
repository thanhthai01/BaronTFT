<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css">
<style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.wrap{width:1280px;height:854px;display:flex}
.main{flex:1;background:var(--gold-500);display:flex;align-items:center;justify-content:center}
.mark{display:flex;align-items:center;gap:32px}
.hex{width:150px;height:170px;background:var(--teal-500);clip-path:var(--hex-clip);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:92px;color:#F1ECDF;box-shadow:12px 12px 0 rgba(24,43,140,.55)}
.wm{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:128px;line-height:.86;color:#F1ECDF;letter-spacing:-.02em}
.wm em{font-style:normal;color:var(--teal-500);display:block}
.strip{width:220px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head>
<body><div class="wrap">
<div class="main"><div class="mark"><div class="hex">◆</div><div class="wm">Baron<em>TFT</em></div></div></div>
<div class="strip">
<div style="background:var(--teal-500)"></div>
<div style="background:var(--cost-5)"></div>
<div style="background:var(--cost-4)"></div>
<div style="background:var(--cost-2)"></div>
</div>
</div></body></html>
